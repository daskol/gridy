[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridy"
version = "0.0.0"
description = "A lightweight library for coordinating hyperparameter search."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">= 3.12"
authors = [
    {name = "Daniel Bershatsky", email = "daniel.bershatsky@gmail.com"},
]
maintainers = [
    {name = "Daniel Bershatsky", email = "daniel.bershatsky@gmail.com"},
]
readme = {file = "README.md", content-type = "text/markdown"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.8",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
dev = ["isort", "mypy", "ruff"]
test = ["build>=1.2", "pytest>=8.2", "setuptools>=77"]

[project.scripts]
gridy = "gridy.cli:main"

[tool.isort]
combine_as_imports = true
known_first_party = ["gridy"]
multi_line_output = 4
skip_glob = ["*_pb2.py"]

[tool.mypy]
python_version = "3.12"
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = false
warn_unused_ignores = true
plugins = []

[tool.pytest.ini_options]
minversion = "8.2"
addopts = "-ra -q -m 'not slow'"
testpaths = ["gridy", "tests"]
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
indent-width = 4
line-length = 79
extend-exclude = ["*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "NPY", "PYI", "PTH"]
ignore = ["PTH123"]
preview = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.pycodestyle]
max-doc-length = 79
max-line-length = 79

[tool.setuptools]
include-package-data = false
platforms = ["Linux", "MacOS"]
zip-safe = false

[tool.setuptools.packages.find]
include = ["gridy*"]

[tool.setuptools.package-data]
gridy = ["bin/gridy"]

[tool.cibuildwheel]
# The Go executable has no Python ABI, so one interpreter builds each wheel.
build = ["cp312-manylinux_*", "cp312-macosx_*"]
archs = ["native"]
test-command = "gridy serve --help"

[tool.cibuildwheel.linux]
before-all = "sh {package}/scripts/install-go.sh"
environment = { PATH="/usr/local/go/bin:$PATH", GOOS="linux" }
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { GOOS="darwin", MACOSX_DEPLOYMENT_TARGET="13.0" }

[tool.yapf]
based_on_style = "pep8"
