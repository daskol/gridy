# See PEP-517 and PEP-518 for details.

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ultraopt"
version = "0.0.0"
readme = "README.md"
classifiers = []
dependencies = [
    "aiohttp>=3.8",
    "hyperopt",  # TODO(@daskol): Should be optional.
    "numpy>=2",
]

[project.optional-dependencies]
dev = ["isort", "mypy", "ruff"]
test = ["pytest>=8.2"]

[project.scripts]
ultraopt = "ultraopt.cli:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
