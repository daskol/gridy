# See PEP-517 and PEP-518 for details.

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ultraopt"
version = "0.0.0"
readme = "README.md"
classifiers = []
dependencies = [
    "aiohttp>=3.8",
    "hyperopt",  # TODO(@daskol): Should be optional.
    "numpy>=2",
]

[project.optional-dependencies]
dev = ["isort", "mypy", "ruff"]
test = ["pytest>=8.2"]

[project.scripts]
ultraopt = "ultraopt.cli:main"

[tool.isort]
combine_as_imports = true
known_first_party = ["gridy"]
multi_line_output = 4
skip_glob = ["*_pb2.py"]

[tool.mypy]
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = false
warn_unused_ignores = true
plugins = []

[tool.pytest.ini_options]
minversion = "8.2"
addopts = "-ra -q -m 'not slow'"
testpaths = ["gridy"]
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "cuda: tests that requires CUDA",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
indent-width = 4
line-length = 79
extend-exclude = ["*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "NPY", "PYI", "PTH"]
ignore = ["PTH123"]
preview = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.pycodestyle]
max-doc-length = 79
max-line-length = 79

[tool.setuptools]
include-package-data = false
platforms = ["Linux"]
zip-safe = true

[tool.setuptools.packages.find]
include = ["gridy*"]

[tool.setuptools.package-data]

[tool.setuptools_scm]
write_to = "gridy/version.py"

[tool.yapf]
based_on_style = "pep8"
