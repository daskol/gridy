name: Linting and testing

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &python-paths
      - '**/*.py'
      - '.github/workflows/on-push.yml'
      - '.pre-commit-config.yaml'
      - 'gridy/**'
      - 'pyproject.toml'
  pull_request:
    paths: *python-paths

permissions:
  contents: read

jobs:
  lint:
    name: Linting with Python 3.14
    runs-on: 'ubuntu-26.04'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          cache: 'pip'
          python-version: '3.14'

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  test:
    name: Testing with Python 3.14
    needs: lint
    runs-on: 'ubuntu-26.04'
    container:
      image: 'ubuntu:26.04'
    env:
      PIP_CACHE_DIR: /tmp/pip-cache
    steps:
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: cache-apt
        env:
          cache-name: cache-apt-packages
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-build-${{ env.cache-name }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}
            ${{ runner.os }}-build-
            ${{ runner.os }}

      # See https://github.com/actions/setup-python/issues/861 for details.
      - name: Install system dependencies
        run: |
          apt update
          apt install -y --no-install-recommends libffi8 lsb-release sqlite3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: '3.14'

      # Built-in caching invokes a pip script that can fail in containers.
      # See https://github.com/actions/setup-python/issues/719.
      - name: Prepare pip cache
        run: mkdir -p "$PIP_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-ubuntu-26.04-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-ubuntu-26.04-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-

      - name: Install build and test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U build 'pytest>=8.2' pytest-cov

      - name: Build Python distributions
        run: python -m build

      - name: Install and check Python package
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pip check
          python -I -c 'import gridy'
          gridy --help

      - name: Test with pytest
        run: |
          export PYTHON_TAG=$(
            python -c 'import sys; print(sys.implementation.cache_tag)')
          pytest -vv \
            --cov-report=html:coverage/html/${PYTHON_TAG} \
            --cov-report=xml:coverage/xml/report.${PYTHON_TAG}.xml \
            --cov=gridy \
            --junitxml=pytest/report.${PYTHON_TAG}.xml

      - name: Upload PyTest report for Python 3.14
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pytest-report
          path: |
            coverage
            pytest

      - name: Check typing
        run: mypy gridy || true
